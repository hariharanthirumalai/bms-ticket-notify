name: Check Scene bookings
on:
 schedule:
   - cron: "*/5 * * * *"
 workflow_dispatch:
permissions:
 actions: write   # lets the job disable itself once bookings are found
 contents: read
jobs:
 check:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-python@v5
       with:
         python-version: "3.12"
     - run: pip install requests
     - id: check
       run: python check_movie.py
       env:
         NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
     - name: Stop checking once found
       if: steps.check.outputs.found == 'true'
       run: gh workflow disable "Check Scene bookings"
       env:
         GH_TOKEN: ${{ github.token }}
         GH_REPO: ${{ github.repository }}
